    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary:       #0F172A;
            --accent:        #204cf8;
            --white:         #FFFFFF;
            --off-white:     #FAF8F4;
            --text-muted:    #6B7280;
            --border-light:  #F0ECE4;
            --font-heading:  'Plus Jakarta Sans', -apple-system, sans-serif;
            --font-body:     'Poppins', -apple-system, sans-serif;
            --radius-md:     12px;
        }

        body {
            font-family: var(--font-body);
            background: var(--off-white);
            color: var(--primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .ty-header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--border-light);
            background: var(--white);
        }

        .ty-header a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .ty-header img {
            height: 36px;
            width: auto;
        }

        /* ── Main ── */
        .ty-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        .ty-card {
            background: var(--white);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            padding: 64px 56px;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }

        .ty-icon {
            width: 72px;
            height: 72px;
            background: rgba(32, 76, 248, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            font-size: 1.75rem;
            color: var(--accent);
        }

        .ty-card h1 {
            font-family: var(--font-heading);
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .ty-card h1 em {
            font-style: italic;
            color: var(--accent);
        }

        .ty-card p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .ty-divider {
            width: 40px;
            height: 2px;
            background: var(--accent);
            margin: 0 auto 32px;
            border-radius: 2px;
        }

        .ty-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary);
            color: var(--white);
            text-decoration: none;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 14px 28px;
            border-radius: 6px;
            transition: background 0.2s ease, transform 0.15s ease;
            letter-spacing: 0.01em;
        }

        .ty-btn:hover {
            background: var(--accent);
            transform: translateY(-1px);
        }

        .ty-btn i { font-size: 0.8rem; }

        /* ── Footer ── */
        .ty-footer {
            padding: 20px 40px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-light);
        }

        @media (max-width: 600px) {
            .ty-header { padding: 20px 24px; }
            .ty-card { padding: 48px 28px; }
        }
    </style>
</head>
<body>

<header class="ty-header">
    <a href="index.html">
        <img src="images/logo.png" alt="FlatPackCo">
    </a>
</header>

<main class="ty-main">
    <div class="ty-card">
        <div class="ty-icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h1>Thank you — <em>we'll be in touch.</em></h1>

        <div class="ty-divider"></div>

        <p>
            Your quote request has been received. A member of our project team will review your details and get back to you within <strong>one business day</strong>.
        </p>

        <a href="index.html" class="ty-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Homepage
        </a>
    </div>
</main>

<footer class="ty-footer">
    &copy; 2024 FlatPackCo &nbsp;&middot;&nbsp; Andheri East, Mumbai 400069
</footer>

</body>
